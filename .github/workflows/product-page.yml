name: Product page and v0 release artifacts

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.filter.outputs.app }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect app code changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            app:
              - 'cmd/**'
              - 'internal/**'
  product-page:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate milestone pages from closed issues
        env:
          GH_TOKEN: ${{ github.token }}
          GH_AUTHOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          python -m pip install markdown
          mkdir -p public

          python - <<'PY'
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          import markdown

          repo_root = Path('.')
          public_dir = repo_root / 'public'
          public_dir.mkdir(exist_ok=True)

          def slugify(value: str) -> str:
              value = value.strip().lower()
              value = re.sub(r'[^a-z0-9]+', '-', value)
              value = re.sub(r'-+', '-', value).strip('-')
              return value or 'milestone'

          def milestone_sort_key(name: str):
              match = re.search(r'Milestone\s+(\d+)', name, re.I)
              if match:
                  return (0, int(match.group(1)))
              return (1, name.lower())

          issue_json = subprocess.check_output(
              [
                  'gh', 'issue', 'list',
                  '--state', 'closed',
                  '--author', os.environ.get('GH_AUTHOR', os.environ.get('GITHUB_ACTOR', '')),
                  '--limit', '200',
                  '--json', 'number,title,body,url',
              ],
              text=True,
              env={**os.environ, 'GH_TOKEN': os.environ['GH_TOKEN']},
          )
          issues = json.loads(issue_json)
          print(f"DEBUG: Found {len(issues)} closed issues authored by {os.environ.get('GH_AUTHOR', os.environ.get('GITHUB_ACTOR', ''))}")

          pages = []
          for issue in issues:
              body = (issue.get('body') or '').strip()
              if not body:
                  continue

              first_line = next((line.strip() for line in body.splitlines() if line.strip()), '')
              if not re.match(r'^#+\s*Milestone \d+\s*', first_line, re.I):
                  continue

              page_name = re.sub(r'^#+\s*Milestone \d+\s*', '', first_line, flags=re.I).strip() or issue.get('title', '').strip()
              content = '\n'.join(line for line in body.splitlines()[1:] if line.strip())
              if not content:
                  content = issue.get('title', '').strip()

              slug = slugify(page_name)
              page_html = markdown.markdown(content or page_name, extensions=['extra', 'sane_lists', 'tables'])
              pages.append((slug, page_name, page_html))

          pages = sorted(pages, key=lambda item: milestone_sort_key(item[1]))
          print(f"DEBUG: Eligible milestone pages after filtering: {len(pages)}")
          for slug, page_name, page_html in pages:
              print(f"DEBUG: Page={slug}.html | Title={page_name}")
              print(f"DEBUG: Page content preview:\n{page_html[:1200]}\n---END PREVIEW---")

          nav = '''
          <nav class="top-nav">
            <a href="index.html">Home</a>
            <a href="milestones.html">Milestones</a>
            <a href="https://github.com/CDRO/corporate-cli/releases/latest">Releases</a>
          </nav>
          '''

          css = '''
          body { font-family: system-ui, sans-serif; line-height: 1.6; margin: 2rem auto; max-width: 1100px; padding: 0 1rem; }
          .top-nav { display: flex; gap: 1rem; flex-wrap: wrap; border-bottom: 1px solid #ddd; margin-bottom: 1.5rem; padding-bottom: 0.75rem; }
          .top-nav a { text-decoration: none; }
          .layout { display: grid; grid-template-columns: minmax(0,1fr) 260px; gap: 2rem; }
          .toc { position: sticky; top: 1rem; }
          .toc ul { list-style: none; padding-left: 0; }
          .toc li { margin: 0.35rem 0; }
          @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } .toc { position: static; } }
          '''

          index_html = f'''<!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1" />
              <title>corporate-cli</title>
              <style>{css}</style>
            </head>
            <body>
              {nav}
              <h1>corporate-cli</h1>
              <p>Versioned milestone pages generated from closed GitHub issues.</p>
              <ul>
                {''.join(f'<li><a href="{slug}.html">{page_name}</a></li>' for slug, page_name, _ in pages)}
              </ul>
            </body>
          </html>
          '''
          (public_dir / 'index.html').write_text(index_html, encoding='utf-8')

          milestone_links = ''.join(f'<li><a href="{slug}.html">{page_name}</a></li>' for slug, page_name, _ in pages)
          milestone_html = f'''<!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1" />
              <title>Milestones</title>
              <style>{css}</style>
            </head>
            <body>
              {nav}
              <h1>Milestones</h1>
              <ul>{milestone_links}</ul>
            </body>
          </html>
          '''
          (public_dir / 'milestones.html').write_text(milestone_html, encoding='utf-8')

          for slug, page_name, page_html in pages:
              content = f'''<!doctype html>
              <html lang="en">
                <head>
                  <meta charset="utf-8" />
                  <meta name="viewport" content="width=device-width, initial-scale=1" />
                  <title>{page_name}</title>
                  <style>{css}</style>
                </head>
                <body>
                  {nav}
                  <h1>{page_name}</h1>
                  {page_html}
                </body>
              </html>
              '''
              (public_dir / f'{slug}.html').write_text(content, encoding='utf-8')
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy-pages:
    needs: product-page
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
  test:
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.app == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run tests
        run: |
          set -euo pipefail
          go test -v ./...
  build-artifacts:
    runs-on: ubuntu-latest
    needs: [changes, test]
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.app == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            goos: linux
            goarch: amd64
            ext: ''
          - os: macos
            goos: darwin
            goarch: amd64
            ext: ''
          - os: windows
            goos: windows
            goarch: amd64
            ext: '.exe'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build corporate and etaroproc binaries
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          mkdir -p dist
          GOOS="${{ matrix.goos }}" GOARCH="${{ matrix.goarch }}" go build -o "dist/corporate-${{ matrix.os }}-${{ matrix.goarch }}${{ matrix.ext }}" ./cmd/corporate
          GOOS="${{ matrix.goos }}" GOARCH="${{ matrix.goarch }}" go build -o "dist/etaroproc-${{ matrix.os }}-${{ matrix.goarch }}${{ matrix.ext }}" ./cmd/etaroproc

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: corporate-${{ matrix.os }}-${{ matrix.goarch }}
          path: dist/*

  release:
    needs: build-artifacts
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/heads/version/')
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Derive release tag from milestone issues
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import re
          import subprocess

          branch = os.environ['GITHUB_REF_NAME']
          major_match = re.match(r'^version/(\d+)-release$', branch)
          if not major_match:
              raise SystemExit(f'unsupported branch: {branch}')

          major = major_match.group(1)
          issue_json = subprocess.check_output(
              [
                  'gh', 'issue', 'list',
                  '--state', 'closed',
                  '--author', os.environ.get('GH_AUTHOR', os.environ.get('GITHUB_ACTOR', '')),
                  '--limit', '200',
                  '--json', 'body',
              ],
              text=True,
              env={**os.environ, 'GH_TOKEN': os.environ['GH_TOKEN']},
          )
          issues = json.loads(issue_json)
          milestones = []
          for issue in issues:
              body = issue.get('body') or ''
              match = re.search(r'^#+\s*Milestone\s+(\d+)\b', body, re.I | re.M)
              if match:
                  milestones.append(int(match.group(1)))

          minor = max(milestones) if milestones else 1
          tag = f'v{major}.{minor}.0'
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as fh:
              fh.write(f'tag={tag}\n')
          print(tag)
          PY

      - name: Assemble release bundle
        run: |
          set -euo pipefail
          mkdir -p final-release
          find release-artifacts -type f -print0 | while IFS= read -r -d '' artifact; do
            cp "$artifact" "final-release/$(basename "$artifact")"
          done
          cd final-release
          sha256sum ./* > checksums.txt
          cat > notes.md <<EOF
          # Release ${{ steps.tag.outputs.tag }}

          Built from the closed milestone issues on branch ${{ github.ref_name }}.

          Artifacts:
          - corporate for Linux, macOS, and Windows
          - etaroproc for Linux, macOS, and Windows
          - sha256 checksums
          EOF

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          body_path: final-release/notes.md
          generate_release_notes: true
          files: |
            final-release/*
