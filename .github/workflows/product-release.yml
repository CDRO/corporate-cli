name: Release artifacts

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.filter.outputs.app }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect app code changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            app:
              - 'cmd/**'
              - 'internal/**'
  test:
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.app == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run tests
        run: |
          set -euo pipefail
          go test -v ./...
  build-artifacts:
    runs-on: ubuntu-latest
    needs: [changes, test]
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.app == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            goos: linux
            goarch: amd64
            ext: ''
          - os: macos
            goos: darwin
            goarch: amd64
            ext: ''
          - os: windows
            goos: windows
            goarch: amd64
            ext: '.exe'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build corporate and etaroproc binaries
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          mkdir -p dist
          GOOS="${{ matrix.goos }}" GOARCH="${{ matrix.goarch }}" go build -o "dist/corporate-${{ matrix.os }}-${{ matrix.goarch }}${{ matrix.ext }}" ./cmd/corporate
          GOOS="${{ matrix.goos }}" GOARCH="${{ matrix.goarch }}" go build -o "dist/etaroproc-${{ matrix.os }}-${{ matrix.goarch }}${{ matrix.ext }}" ./cmd/etaroproc

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: corporate-${{ matrix.os }}-${{ matrix.goarch }}
          path: dist/*

  release:
    needs: build-artifacts
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/heads/version/')
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Derive release tag from milestone issues
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import re
          import subprocess

          branch = os.environ['GITHUB_REF_NAME']
          major_match = re.match(r'^version/(\d+)-release$', branch)
          if not major_match:
              raise SystemExit(f'unsupported branch: {branch}')

          major = major_match.group(1)
          issue_json = subprocess.check_output(
              [
                  'gh', 'issue', 'list',
                  '--state', 'closed',
                  '--author', os.environ.get('GH_AUTHOR', os.environ.get('GITHUB_ACTOR', '')),
                  '--limit', '200',
                  '--json', 'body',
              ],
              text=True,
              env={**os.environ, 'GH_TOKEN': os.environ['GH_TOKEN']},
          )
          issues = json.loads(issue_json)
          milestones = []
          for issue in issues:
              body = issue.get('body') or ''
              match = re.search(r'^#+\s*Milestone\s+(\d+)\b', body, re.I | re.M)
              if match:
                  milestones.append(int(match.group(1)))

          minor = max(milestones) if milestones else 1
          tag = f'v{major}.{minor}.0'
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as fh:
              fh.write(f'tag={tag}\n')
          print(tag)
          PY

      - name: Assemble release bundle
        run: |
          set -euo pipefail
          mkdir -p final-release
          find release-artifacts -type f -print0 | while IFS= read -r -d '' artifact; do
            cp "$artifact" "final-release/$(basename "$artifact")"
          done
          cd final-release
          sha256sum ./* > checksums.txt
          cat > notes.md <<EOF
          # Release ${{ steps.tag.outputs.tag }}

          Built from the closed milestone issues on branch ${{ github.ref_name }}.

          Artifacts:
          - corporate for Linux, macOS, and Windows
          - etaroproc for Linux, macOS, and Windows
          - sha256 checksums
          EOF

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          body_path: final-release/notes.md
          generate_release_notes: true
          files: |
            final-release/*
